<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="368" height="468" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Mani Minars Logo Badge -->
  <g transform="translate(200, 75)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      MANI MINARS
    </text>
  </g>

  <!-- Illustration Container -->
  <g transform="translate(200, 210)">
    <!-- Soft Circle Backdrop -->
    <circle cx="0" cy="0" r="64" fill="#e2e8f0" opacity="0.6" />
    
    <!-- Clothes Hanger & Kids Shirt Icon -->
    <path d="M-36 -12 L0 -38 L36 -12 Q38 -10 36 -8 L32 -5 Q30 -4 28 -6 L0 -26 L-28 -6 Q-30 -4 -32 -5 L-36 -8 Q-38 -10 -36 -12 Z" fill="#94a3b8" />
    <!-- Hook -->
    <path d="M0 -38 Q0 -48 10 -48 Q20 -48 16 -38" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <!-- Shirt Outline -->
    <path d="M-28 -6 L-44 14 L-32 24 L-22 14 L-22 50 L22 50 L22 14 L32 24 L44 14 L28 -6 Z" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Collar & Buttons -->
    <path d="M-8 -5 L0 6 L8 -5" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="20" r="2.5" fill="#dc2626" />
    <circle cx="0" cy="32" r="2.5" fill="#dc2626" />
    <!-- Little Sparkle -->
    <path d="M46 -24 L48 -18 L54 -16 L48 -14 L46 -8 L44 -14 L38 -16 L44 -18 Z" fill="#eab308" />
  </g>

  <!-- Text Information -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
    Product Image Coming Soon
  </text>
  <text x="200" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    Quality Kids Clothing • Ages 1-12 Years
  </text>
  <text x="200" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">
    100% Skin-Safe &amp; Combed Cotton
  </text>
</svg>
